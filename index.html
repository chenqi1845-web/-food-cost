<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>伙食费小账本</title>
<meta name="version" content="20240907">
<meta http-equiv="Cache-Control" content="no-cache">
<style>
:root{
  --bg:#f7f5ef; --card:#fff; --text:#242424; --muted:#888;
  --line:#ece9e1; --accent:#5d745f; --accent2:#e8eee6; --danger:#b85c52;
  --warn:#c98a1d; --warn-bg:#fdf3df;
  --urgent:#b85c52; --urgent-bg:#fbe9e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--text)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:95px}
.top{background:var(--accent);color:#fff;padding:20px 20px 32px;border-radius:0 0 28px 28px;margin-bottom:4px}
.date{font-size:13px;opacity:.7}
h1{font-size:28px;margin:5px 0 18px}
h2{font-size:20px;margin:18px 0 8px}
.big-num{font-size:42px;font-weight:700;letter-spacing:-1px}
.big-num-meta{display:flex;gap:16px;margin-top:10px;font-size:13px;opacity:.8}
.total{background:var(--text);color:#fff;border-radius:22px;padding:22px}
.total small{opacity:.7}
.money{font-size:38px;font-weight:700;margin-top:4px}
.split{display:flex;gap:8px;margin-top:18px}
.pill{background:rgba(255,255,255,.1);padding:8px 11px;border-radius:12px;font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,.97);backdrop-filter:blur(15px);display:flex;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:#aaa;font-size:13px;padding:5px 0;cursor:pointer;text-align:center}
nav button.active{color:var(--accent);font-weight:700}
/* FAB */
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;width:54px;height:54px;background:var(--accent);color:#fff;border-radius:50%;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(93,116,95,.4);z-index:6;display:flex;align-items:center;justify-content:center}
/* 记一笔分类卡片 */
.record-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.rec-card{display:flex;flex-direction:column;align-items:center;padding:16px 6px;background:var(--accent2);border:2px solid transparent;border-radius:18px;cursor:pointer;text-align:center;transition:all .15s}
.rec-card.active{border-color:var(--accent);background:#e8eee6}
.rec-card .rec-icon{font-size:30px;margin-bottom:6px}
.rec-card .rec-label{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.rec-card .rec-hint{font-size:11px;color:var(--muted)}
.rec-card.active .rec-hint{color:var(--accent)}
/* 二级方式按钮 */
.method-btns{display:flex;gap:6px;margin:14px 0 12px}
.method-btn{flex:1;padding:8px 4px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.method-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 隐藏旧的 */
.record-tabs{display:none}
.record-tab{flex:1;padding:9px 6px;background:var(--accent2);color:var(--accent);border:0;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
nav button{flex:1;border:0;background:none;color:#999;font-size:12px;padding:5px}
nav button.active{color:var(--accent);font-weight:700}
nav b{display:block;font-size:20px;margin-bottom:2px}
.page{display:none;padding:12px 20px}
.page.active{display:block}
.card{background:var(--card);border-radius:18px;padding:17px;margin:10px 0;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13px}
.section-title{font-size:18px;font-weight:700;margin:22px 0 8px}
.page-header{margin-bottom:8px}
.page-header h2{margin:18px 0 4px}
.page-header .muted{font-size:12px}
button.primary{background:var(--accent);color:white;border:0;border-radius:14px;padding:13px 17px;font-weight:700;width:100%;font-size:15px}
.actions{display:flex;gap:8px}
.actions button{flex:1}
button.secondary{background:var(--accent2);color:var(--accent);border:0;border-radius:12px;padding:10px;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:7px 10px;font-weight:600}
button.danger{background:#f8e9e7;color:var(--danger);border:0;border-radius:10px;padding:7px 10px}
input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;outline:none}
label{display:block;font-size:13px;color:#777;margin:12px 0 6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}
.close{float:right;border:0;background:none;font-size:25px}
.food{padding:13px 0;border-bottom:1px solid var(--line)}
.food:last-child{border:0}
.tag{font-size:12px;background:#f0eee8;border-radius:8px;padding:4px 7px;color:#777}
.empty{text-align:center;color:#999;padding:35px 10px}
.bigstat{font-size:27px;font-weight:700}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent)}
/* 重复食材提醒 */
.dup-warn{background:var(--warn-bg);border:1px solid #ecd9a8;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px;color:#7a5a13}
.dup-warn b{color:var(--warn)}
.dup-warn .row{margin-top:6px;gap:6px}
.dup-warn button{font-size:12px;padding:6px 9px}
.similar-row{background:#fbf7ee;border-left:3px solid var(--warn);padding-left:10px;border-radius:6px}
/* 周统计 */
.week-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
.week-head h3{margin:0;font-size:16px}
.week-arrow{background:none;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--text)}
.day-row{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.day-row:last-child{border:0}
.day-row .row b{font-size:16px}
.day-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:13px;color:#555}
.day-detail.open{max-height:600px}
.day-detail .item{display:flex;justify-content:space-between;padding:4px 0}
/* Toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* 编辑按钮 */
.edit-row{display:flex;gap:6px;align-items:center}

/* 提醒区 */
.alert-bar{background:var(--warn-bg);border:1px solid #ecd9a8;border-radius:14px;padding:11px 14px;margin:0 0 10px;font-size:13px;color:#7a5a13;display:flex;justify-content:space-between;align-items:center;gap:10px}
.alert-bar.urgent{background:var(--urgent-bg);border-color:#ecc7c1;color:#7a2e25}
.alert-bar b{color:var(--warn)}
.alert-bar.urgent b{color:var(--urgent)}
.alert-bar button{background:rgba(255,255,255,.6);border:1px solid currentColor;border-radius:8px;padding:4px 10px;font-size:12px;color:inherit;cursor:pointer}

/* 库存高亮（即将过期/已过期） */
.expire-soon{background:var(--warn-bg);border-left:3px solid var(--warn);padding-left:10px;border-radius:6px}
.expired{background:var(--urgent-bg);border-left:3px solid var(--urgent);padding-left:10px;border-radius:6px}

/* 语音录入 */
.voice-mic{display:flex;align-items:center;gap:10px;background:var(--accent2);border-radius:12px;padding:14px;margin-top:12px;cursor:pointer}
.voice-mic .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none;transition:transform .2s, background .2s}
.voice-mic.live .dot{background:var(--danger);animation:pulse 1s infinite}
.voice-mic .hint{color:var(--accent);font-weight:600;font-size:14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.voice-result{background:#fff;border:1px dashed var(--accent);border-radius:12px;padding:12px;margin-top:8px;font-size:15px;min-height:50px}
.voice-result .alt{background:#f6f6f0;border-radius:6px;padding:6px 8px;margin-top:6px;cursor:pointer;font-size:13px;color:#666}

/* OCR */
.ocr-zone{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;margin-top:12px}
.ocr-zone:hover{border-color:var(--accent);color:var(--accent)}
.ocr-zone img{max-width:100%;max-height:240px;border-radius:8px;margin-top:10px}
.ocr-progress{margin-top:10px;font-size:13px;color:var(--accent)}
.ocr-list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;max-height:280px;overflow:auto}
.ocr-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f1ea}
.ocr-row:last-child{border:0}
.ocr-row input[type=text],.ocr-row input[type=number]{padding:6px 8px;font-size:13px}
.ocr-row .col-name{flex:2;min-width:0}
.ocr-row .col-price{flex:1;min-width:0}
.ocr-row .col-qty{flex:1;min-width:0}
.ocr-row .col-unit{flex:1;min-width:0;font-size:12px;padding:6px 4px}
.ocr-row .col-del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;flex:none}
.ocr-name-original{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 食材保质期标签 */
.shelf-pill{font-size:11px;border-radius:6px;padding:2px 6px;margin-left:6px;background:#eef4ee;color:var(--accent)}
.shelf-pill.fridge{background:#e3eef7;color:#2a6090}
.shelf-pill.frozen{background:#e7f0fa;color:#3978b5}
.shelf-pill.room{background:#faeee5;color:#a86840}

.storage-tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.storage-tabs button{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#777;cursor:pointer}
.storage-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 数据可视化 */
.viz-card{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:10px;border:1px solid var(--line)}
.viz-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text)}
.viz-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.viz-bar-wrap{flex:1;margin:0 8px;height:6px;background:#eee;border-radius:99px;overflow:hidden;min-width:60px}
.viz-bar{height:100%;border-radius:99px;transition:width .3s}
.viz-swatch{width:10px;height:10px;border-radius:3px;flex:none;margin-right:6px}
.viz-total{font-size:13px;color:var(--muted);margin-bottom:6px}
.viz-pie{width:120px;height:120px;display:block;margin:0 auto}
.viz-pie-center{text-anchor:middle;font-weight:700;font-size:13px;fill:var(--text)}
.viz-pie-sub{text-anchor:middle;font-size:10px;fill:var(--muted)}
.viz-legend{margin-top:8px;font-size:12px}
.viz-legend-item{display:flex;align-items:center;padding:3px 0;color:#555}
.viz-timeline{position:relative;padding:10px 0}
.viz-timeline-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;background:#f5f3ed;margin:8px 0}
.viz-timeline-seg{position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;min-width:0;transition:flex .3s}
.viz-timeline-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 2px}
.viz-priority-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f3f1ea;gap:8px}
.viz-priority-row:last-child{border:0}
.viz-priority-name{flex:1;font-weight:600}
.viz-priority-meta{font-size:11px;color:var(--muted)}
.viz-cat-group{margin-top:14px}
.viz-cat-group-title{font-size:13px;font-weight:700;color:var(--muted);padding:4px 0;margin-bottom:4px;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="date" id="today"></div>
    <button onclick="showSyncModal()" style="background:none;border:0;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;padding:4px">⚙</button>
  </div>
  <div class="big-num" id="todayTotal">¥0.00</div>
  <div class="big-num-meta"><span>外食 ¥<b id="todayOutside">0.00</b></span><span>自炊 ¥<b id="todayCook">0.00</b></span></div>
</header>

<section id="home" class="page active">
  <div id="todayList"></div>
  <div class="section-title" id="recentTitle" style="display:none">即将过期（优先消耗）</div>
  <div id="recentFood"></div>
</section>

<section id="inventory" class="page">
  <div class="page-header">
    <h2>食材库存</h2>
    <div class="muted" style="font-size:13px">采购金额会随使用比例自动减少</div>
  </div>
  <div id="inventoryStats"></div>
  <div class="storage-tabs" id="viewTabs">
    <button data-view="expire" class="active">⏳ 按过期</button>
    <button data-view="category">⊞ 按分类</button>
  </div>
  <div id="inventoryList"></div>
</section>

<section id="stats" class="page">
  <h2>统计</h2>
  <div class="card"><div class="muted">本月伙食费</div><div class="bigstat" id="monthTotal">¥0.00</div><div class="muted" id="monthAvg"></div></div>
  <div class="card">
    <div class="row"><span>外食</span><b id="monthOutside">¥0.00</b></div>
    <div class="bar"><i id="outsideBar"></i></div>
    <div class="row" style="margin-top:15px"><span>自己做饭</span><b id="monthCook">¥0.00</b></div>
    <div class="bar"><i id="cookBar"></i></div>
  </div>
  <div class="week-head">
    <button class="week-arrow" onclick="shiftWeek(-1)">‹ 上一周</button>
    <h3 id="weekRange">本周</h3>
    <button class="week-arrow" onclick="shiftWeek(1)">下一周 ›</button>
  </div>
  <div class="card" id="weekCard"></div>
  <div class="section-title" id="recordsTitle">消费记录</div>
  <div id="recordsList"></div>
</section>

<nav>
<button class="active" onclick="showPage('home',this)">⌂<br><small>首页</small></button>
<button onclick="showPage('inventory',this)">⊞<br><small>库存</small></button>
<button onclick="showPage('stats',this)">⬡<br><small>统计</small></button>
</nav>

<!-- FAB -->
<div class="fab" onclick="openRecordModal()">+</div>

<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* ============================================================
   数据层 + 迁移 v2 → v3
   ============================================================ */
const KEY='food_cost_v3';
const SCHEMA=3;

async function syncData(){
  return loadDB();
}

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='food-cost-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); toast('已导出');
}
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
      if(d._schema){db=d;localStorage.setItem(KEY,JSON.stringify(db));render();toast('导入成功');}
      else toast('文件格式不对');}catch(e){toast('读取失败');}};r.readAsText(f);};
  i.click();
}
function showSyncStatus(){
  const el=document.getElementById('syncStatus');
  if(el) el.style.display='none';
}

function loadDB(){
  let raw;
  try{ raw=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ raw=null; }
  if(raw && raw._schema===SCHEMA) return raw;

  // 尝试迁移 v2 → v3
  let prev=null;
  try{ prev=JSON.parse(localStorage.getItem('food_cost_v2')||'null'); }catch(e){ prev=null; }
  if(!prev){
    try{ prev=JSON.parse(localStorage.getItem('food_cost_v1')||'null'); }catch(e){ prev=null; }
  }

  if(!prev){ return {_schema:SCHEMA, foods:[], meals:[], outside:[], reminders:[]}; }

  // 升级 foods：补 shelfLife / storage / expiresAt / batchKey / unitPrice
  prev.foods.forEach(f=>{
    if(f._origQty==null) f._origQty=f.qty||1;
    if(f.unitPrice==null) f.unitPrice = f._origQty>0 ? f.amount/f._origQty : f.amount;
    if(f.remaining==null) f.remaining = f.qty * f.unitPrice;
    if(!f.batchKey) f.batchKey=f.name+'|'+f.date;
    if(!f.unit) f.unit='portion';
    if(!f.storage) f.storage='fridge';
    if(f.shelfLifeDays==null) f.shelfLifeDays=SHELF_DB[normalize(f.name)]?.days || 7;
    if(!f.expiresAt){
      // 默认 7 天后过期
      const exp=new Date(f.date+'T00:00:00'); exp.setDate(exp.getDate()+(f.shelfLifeDays||7));
      f.expiresAt=exp.toISOString().slice(0,10);
    }
    if(f.lowStockThreshold==null) f.lowStockThreshold=Math.max(1, Math.round((f._origQty||1)*0.2));
  });

  prev._schema=SCHEMA;
  prev.reminders = prev.reminders || [];
  localStorage.setItem(KEY, JSON.stringify(prev));
  return prev;
}

/* ============================================================
   快捷悬浮输入栏
   ============================================================ */
// 自由文字智能解析（支持多种格式混合）
// 格式示例：牛奶10元500ml、鸡蛋15元12个、西红柿8元500g
// 也支持：买了牛奶10块500ml
function parseQuickText(text){
  text=text.replace(/[，。、；：""''（）【】]/g,' ').trim();
  // 先按换行/、分割成句
  const lines=text.split(/[\n\/]+/).filter(l=>l.trim());
  const results=[];
  for(const line of lines){
    const s=line.trim();
    if(!s) continue;
    // 提取食材名（金额前的文字）
    const foodM=s.match(/^([\u4e00-\u9fa5a-zA-Z]+)/);
    const food=foodM?foodM[1]:'';
    if(!food){results.push({raw:s,name:'',ok:false,msg:'无法识别食材名'});continue;}
    // 提取金额：数字+元/块/块/圆
    const amtM=s.match(/(\d+(?:\.\d+)?)\s*(?:元|块|圆)/);
    const amount=amtM?parseFloat(amtM[1]):0;
    if(!amount){results.push({raw:s,name:food,ok:false,msg:'未找到金额'});continue;}
    // 提取数量：数字+单位
    const qtyM=s.match(/(\d+(?:\.\d+)?)\s*(ml|ML|Ml|mL|g|G|克|kg|KG|Kg|个|只|盒|袋|包|份|瓶|罐|把|根|颗|粒|升|L|l)/);
    let qty=0,unit='portion';
    if(qtyM){
      qty=parseFloat(qtyM[1]);
      const u=qtyM[2].toLowerCase();
      if(u==='ml'||u==='l'||u==='升') unit='ml';
      else if(u==='g'||u==='kg'||u==='克') unit='g';
      else if(u==='个'||u==='只'||u==='盒'||u==='袋'||u==='包'||u==='瓶'||u==='罐'||u==='把'||u==='根'||u==='颗'||u==='粒') unit='count';
      else unit='portion';
    }else{
      // 没有数量则默认1份
      qty=1;unit='portion';
    }
    results.push({raw:s,name:food,amount,qty,unit,ok:true});
  }
  return results;
}

function quickSubmit(){
  const input=document.getElementById('quickInput');
  const text=input.value.trim();
  if(!text) return;
  const items=parseQuickText(text);
  if(items.length===0){toast('未能识别内容');return;}
  // 如果只有一条且识别成功，直接加入
  if(items.length===1&&items[0].ok){
    const it=items[0];
    addFoodQuick(it.name,it.amount,it.qty,it.unit);
    input.value='';
    addQuickSug(it.name);
    toast('已加入：'+it.name);
    return;
  }
  // 多条或识别有疑问 → 显示预览
  showQuickPreview(items);
  input.value='';
}

function showQuickPreview(items){
  const okItems=items.filter(x=>x.ok);
  if(!okItems.length){
    modal(`<h3>❓ 无法识别</h3>
      <div class="muted" style="padding:12px">未能识别任何食材，请尝试格式：<br><b>牛奶 10元 500ml</b></div>
      <button class="primary" onclick="closeModal()">知道了</button>`);
    return;
  }
  const html=`<h3>📋 预览（${okItems.length}项）</h3>
    <p class="muted" style="font-size:13px">确认后点击加入库存</p>
    ${okItems.map((it,i)=>`<div class="qitem">
      <div><div class="qitem-name">${it.name}</div>
        <div class="qitem-parse">¥${it.amount} · ${it.qty}${it.unit==='ml'?'ml':it.unit==='g'?'g':'个'}</div></div>
      <div class="qitem-ok">✓</div>
    </div>`).join('')}
    ${items.filter(x=>!x.ok).map(x=>`<div class="qitem">
      <div><div class="qitem-name" style="color:var(--danger)">❌ ${x.name||x.raw}</div>
        <div class="qitem-parse">${x.msg}</div></div>
    </div>`).join('')}
    <button class="primary" style="margin-top:16px" onclick="confirmQuickItems(window._pendingItems)">✓ 全部加入库存</button>
    <button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">取消</button>`;
  window._pendingItems = okItems;
  modal(html);
}

function confirmQuickItems(items){
  closeModal();
  for(const it of items){
    addFoodQuick(it.name,it.amount,it.qty,it.unit);
  }
  toast(`已加入 ${items.length} 项`);
  render();
}

function addFoodQuick(name,amount,qty,unit){
  name=name.trim();
  const todayStr=today();
  const norm=normalizeFoodName(name);
  const n=norm.canonical||name;
  const shelf=SHELF_DB[normalize(n)]||shelfFor(n);
  const existing=db.foods.find(f=>f.name===n&&f.date===todayStr);
  if(existing){
    const oldUnitPrice=existing.amount/existing._origQty;
    existing._origQty+=qty;
    existing.qty+=qty;
    existing.amount+=amount;
    existing.remaining=oldUnitPrice*existing.qty;
    existing.unitPrice=existing.amount/existing._origQty;
    save();return;
  }
  const exp=new Date(todayStr+'T00:00:00');
  exp.setDate(exp.getDate()+(shelf?.days||7));
  db.foods.push({
    id:Date.now(),name:n,date:todayStr,amount:+amount,qty:+qty,_origQty:+qty,
    unitPrice:+amount/(+qty||1),remaining:+amount,unit:unit||'portion',
    storage:shelf?.storage||'fridge',shelfLifeDays:shelf?.days||7,
    expiresAt:exp.toISOString().slice(0,10),lowStockThreshold:Math.max(1,Math.round((+qty||1)*0.2)),
    batchKey:n+'|'+todayStr
  });
  save();
}

let db;
// 启动
(async()=>{
  try{
    db = await syncData();
    db.foods.forEach(f=>{
      if(f._origQty==null) f._origQty=f.qty||1;
      if(f.unitPrice==null) f.unitPrice=f._origQty>0?f.amount/f._origQty:f.amount;
      if(f.remaining==null) f.remaining=f.qty*f.unitPrice;
      if(!f.batchKey) f.batchKey=f.name+'|'+f.date;
      if(!f.unit) f.unit='portion';
      if(!f.storage) f.storage='fridge';
      if(f.shelfLifeDays==null) f.shelfLifeDays=7;
      if(!f.expiresAt){const exp=new Date(f.date+'T00:00:00');exp.setDate(exp.getDate()+f.shelfLifeDays);f.expiresAt=exp.toISOString().slice(0,10);}
      if(f.lowStockThreshold==null) f.lowStockThreshold=Math.max(1,Math.round((f._origQty||1)*0.2));
    });
  }catch(e){console.warn('加载失败，使用空白数据',e);}
  render();
  showSyncStatus();
  ensureNotifPermission();
  setInterval(runNotifCheck, 60000);
})();

function shelfFor(name){
  const k = normalize(name);
  // 优先精确匹配
  if(SHELF_DB[k]) return SHELF_DB[k];
  // 子串匹配
  for(const key in SHELF_DB){
    if(k.includes(key) || key.includes(k)) return SHELF_DB[key];
  }
  return {days:7, storage:'fridge'}; // 默认
}

  '羊肉':'g','鱼':'g','虾':'g','螃蟹':'count','贝类':'g','海鲜':'g',
  '白菜':'count','番茄':'count','土豆':'count','洋葱':'count','胡萝卜':'count','黄瓜':'count','茄子':'count',
  '青椒':'count','辣椒':'count','花菜':'count','蘑菇':'g','香菇':'g','豆腐':'g',
  '苹果':'count','香蕉':'count','橙子':'count','葡萄':'g','草莓':'count','蓝莓':'g','西瓜':'count','桃子':'count','梨':'count','芒果':'count','柠檬':'count',
  '牛奶':'ml','酸奶':'ml',
  '汽水':'ml','矿泉水':'ml','啤酒':'ml','果汁':'ml',
  '零食':'portion','坚果':'g','糖果':'portion','果干':'g',
};
function defaultUnit(name){
  return DEFAULT_UNIT[name] || 'portion';
}

function normalizeFoodName(raw){
  if(!raw) return {canonical:'', display:raw||''};
  let s = raw.trim();

  // 1) 去掉品牌前缀（英文/中文品牌后跟 /）
  s = s.replace(BRAND_RE, '');

  // 2) 去掉规格/数字词
  //    数字+单位（如 "518g"、"1kg"、"100ml"、"1L"）
  s = s.replace(/\d+\.?\d*\s*(g|kg|ml|l|斤|两|克|千克|毫升|升)\b/gi, '');
  //    "7天"/"3天"/"30天" 等天数（"X天价保" "X天无理由" 都属于促销噪音）
  s = s.replace(/\d+\s*天/g, '');
  //    纯数字串
  s = s.replace(/\b\d+(\.\d+)?\b/g, '');
  s = s.replace(/\bx\d+\b/gi, '').replace(/\b×\d+\b/g, '');

  // 3) 去掉噪音词（多次循环，处理连续出现的）
  for(let pass=0;pass<3;pass++){
    let before = s;
    for(const w of NOISE_TOKENS){
      const esc = w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      s = s.replace(new RegExp(esc,'g'), '');
    }
    if(s===before) break;
  }

  // 4) 清理多余空格、标点、孤立单字（连续标点中间的孤立字）
  s = s.replace(/[\s\u3000]+/g,'')
       .replace(/^[、,，.\-—_/\\]+|[、,，.\-—_/\\]+$/g,'')
       .replace(/([、,，.\-—_/\\])\1+/g,'$1') // 合并连续标点
       .trim();

  if(!s){ return {canonical:raw.trim(), display:raw.trim()}; }

  // 5) 在归一词典中找匹配（优先长关键词）
  const sorted = [...CATEGORY_RULES].sort((a,b)=>Math.max(...b.kw.map(k=>k.length))-Math.max(...a.kw.map(k=>k.length)));
  for(const rule of sorted){
    for(const kw of rule.kw){
      if(s.includes(kw)) return {canonical:rule.cat, display:raw.trim()};
    }
  }

  // 6) 词典没命中，但去噪后仍有中文 → 用去噪后的字符串作为归一名
  if(/[\u4e00-\u9fa5]/.test(s) && s.length>=2){
    return {canonical:s, display:raw.trim()};
  }
  return {canonical:raw.trim(), display:raw.trim()};
}

/* ============================================================
   模糊匹配
   ============================================================ */
function normalize(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,''); }
function levenshtein(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+c);
  }
  return dp[m][n];
}
function similarity(a,b){
  const na=normalize(a), nb=normalize(b);
  if(!na||!nb) return 0;
  if(na.includes(nb)||nb.includes(na)) return 0.99;
  const d=levenshtein(na,nb);
  const max=Math.max(na.length, nb.length);
  return 1 - d/max;
}
function findSimilar(name, threshold=0.6){
  const set=new Map();
  db.foods.forEach(f=>{ if(!set.has(f.name)) set.set(f.name,true); });
  const matches=[];
  set.forEach((_,n)=>{
    const s=similarity(name, n);
    if(s>=threshold) matches.push({name:n, score:s});
  });
  matches.sort((a,b)=>b.score-a.score);
  return matches.slice(0,3);
}

function getSelectedStorage(){ const a=document.querySelector('#storageTabs button.active'); return a?a.dataset.s:'fridge'; }
function addFood(){
  const rawN=document.getElementById('bName').value.trim();
  const a=+document.getElementById('bAmount').value;
  const q=+document.getElementById('bQty').value;
  const u=document.getElementById('bUnit').value;
  const date=document.getElementById('bDate').value;
  const storage=getSelectedStorage();
  if(!rawN){ toast('请填写食材名'); return; }
  if(!a||a<=0){ toast('请填写金额'); return; }
  if(!q||q<=0){ toast('请填写数量'); return; }

  // 归一化食材名（去除品牌、规格、促销词噪音，归到本质类）
  const norm = normalizeFoodName(rawN);
  const n = norm.canonical || rawN;

  const shelf = SHELF_DB[normalize(n)] || shelfFor(n);

  const existing = db.foods.find(f=>f.name===n && f.date===date);
  if(existing){
    // 合并：保持单价不变，累加 amount 和 qty
    const oldUnitPrice = existing.amount / existing._origQty;
    existing._origQty += q;
    existing.qty += q;
    existing.amount += a;
    existing.remaining = oldUnitPrice * existing.qty;
    existing.unitPrice = existing.amount / existing._origQty;
    closeModal(); save(); toast(n!==rawN ? `已合并到「${n}」同日批次` : '已合并到同日批次');
    return;
  }
  // 计算过期日期
  const exp=new Date(date+'T00:00:00');
  exp.setDate(exp.getDate() + (storage==='frozen' ? Math.max(30, shelf.days) : shelf.days));

  db.foods.push({
    id:Date.now(), date, name:n, displayName: norm.display||rawN, amount:a, remaining:a, qty:q, _origQty:q, unit:u,
    unitPrice: a/q,
    batchKey:n+'|'+date, storage,
    shelfLifeDays: shelf.days,
    expiresAt: exp.toISOString().slice(0,10),
    lowStockThreshold: Math.max(1, Math.round(q*0.2))
  });
  closeModal(); save(); toast(n!==rawN ? `已加入：${n}（原: ${rawN}）` : '已加入库存');
}

function addCookRow(){
  const wrap=document.getElementById('cookRows');
  // 按"最早过期日期"升序：取每个食材名下所有批次的最小 expiresAt
  const usable = db.foods.filter(f=>f.remaining>0.001);
  const nameMap = new Map();
  for(const f of usable){
    const cur = nameMap.get(f.name);
    if(!cur || f.expiresAt < cur.expiresAt){
      nameMap.set(f.name, f);
    }
  }
  const groups = [...nameMap.entries()]
    .sort((a,b)=>a[1].expiresAt.localeCompare(b[1].expiresAt))
    .map(([name])=>name);
  if(!groups.length){ toast('无可用库存'); return; }
  const div=document.createElement('div'); div.className='food';
  // 给每个 option 加 data-expires 便于测试和展示
  div.innerHTML=`<select class="foodName" onchange="updateCook()">${groups.map(n=>{
    const f = nameMap.get(n);
    const d = daysBetween(today(), f.expiresAt);
    const tag = d<0 ? '⚠过期' : d===0 ? '⏳今天' : d<=3 ? `⏳${d}天` : '';
    return `<option value="${n}">${n}${tag?` (${tag})`:''}</option>`;
  }).join('')}</select>
    <div style="display:flex;gap:7px;margin-top:7px">
      <select class="useMode" onchange="toggleUseInput(this);updateCook()">
        <option value="qty">精准数量</option>
        <option value="half">1/2</option>
        <option value="third">1/3</option>
        <option value="quarter">1/4</option>
        <option value="remain">剩余</option>
      </select>
      <input class="useQty" type="number" step="0.01" placeholder="数量" oninput="updateCook()">
      <button class="danger" onclick="this.parentElement.parentElement.remove();updateCook()">删除</button>
    </div>`;
  wrap.appendChild(div);
  toggleUseInput(div.querySelector('.useMode'));
  updateCook();
}
function toggleUseInput(sel){ sel.parentElement.querySelector('.useQty').style.display = sel.value==='qty' ? 'block' : 'none'; }

function fifoPreview(name, qty, mode){
  const batches=db.foods.filter(f=>f.name===name && f.remaining>0.001).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let need, cost=0;
  if(mode!=='qty'){
    const totalQty=batches.reduce((s,f)=>s+f.qty,0);
    need = mode==='remain' ? totalQty : totalQty*({half:.5, third:1/3, quarter:.25}[mode]||1);
  } else { need=qty; }
  for(const f of batches){
    if(need<=1e-9) break;
    const take=Math.min(f.qty, need);
    cost += take/f.qty*f.amount;
    need -= take;
  }
  return {cost, need};
}
function updateCook(){
  let total=0;
  document.querySelectorAll('#cookRows .food').forEach(r=>{
    const name=r.querySelector('.foodName').value;
    const mode=r.querySelector('.useMode').value;
    const qty=mode==='qty' ? (+r.querySelector('.useQty').value||0) : 0;
    total += fifoPreview(name,qty,mode).cost;
  });
  document.getElementById('cookTotal').textContent='本餐 '+money(total);
}
function saveCook(){
  const date=document.getElementById('cDate').value;
  const meal=document.getElementById('cMeal').value;
  const items=[], rows=[...document.querySelectorAll('#cookRows .food')];
  if(!rows.length){ toast('至少添加一个食材'); return; }
  let total=0;
  for(const r of rows){
    const name=r.querySelector('.foodName').value;
    const mode=r.querySelector('.useMode').value;
    const qty=mode==='qty' ? (+r.querySelector('.useQty').value||0) : 0;
    const preview = fifoPreview(name, qty, mode);
    if(preview.need > 1e-8){ toast(`${name} 库存不足`); return; }
  }
  for(const r of rows){
    const name=r.querySelector('.foodName').value;
    const mode=r.querySelector('.useMode').value;
    let need;
    if(mode==='qty'){ need = (+r.querySelector('.useQty').value||0); }
    else{
      const totalQty = db.foods.filter(f=>f.name===name && f.remaining>0.001).reduce((s,f)=>s+f.qty,0);
      need = mode==='remain' ? totalQty : totalQty*({half:.5, third:1/3, quarter:.25}[mode]||1);
    }
    if(need<=0) continue;
    const batches=db.foods.filter(f=>f.name===name && f.remaining>0.001).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    for(const f of batches){
      if(need<=1e-9) break;
      const take=Math.min(f.qty, need);
      const up = f.unitPrice || (f._origQty>0 ? f.amount/f._origQty : 0);
      const cost = take * up;
      f.qty -= take;
      f.remaining = f.qty * up;
      items.push({foodId:f.id,name:f.name,qty:take,unit:f.unit,cost,ratio:mode,batchDate:f.date});
      total += cost;
      need  -= take;
    }
  }
  if(!items.length){ toast('没有可保存的食材'); return; }
  db.meals.push({id:Date.now(),date,meal,total,items});
  closeModal(); save(); toast('本餐已保存');
}

function submitCookBatch(){
  const text=document.getElementById('cookInput').value.trim();
  if(!text){toast('请输入内容');return;}
  // Parse with a variant that doesn't need amount
  const lines=text.split('\n').filter(l=>l.trim());
  const usable=db.foods.filter(f=>f.remaining>0.001);
  const nameMap=new Map();
  for(const f of usable){
    if(!nameMap.has(f.name)) nameMap.set(f.name, []);
    nameMap.get(f.name).push(f);
  }
  const parsed=lines.map(line=>{
    const m=line.match(/^([^0-9￥¥\s,，]+)/);
    if(!m) return null;
    const name=m[1].trim();
    const rest=line.slice(m[0].length).replace(/[0-9￥¥\s,，.]+/g,' ').trim();
    const qty=parseFloat(rest)||1;
    const unit=(rest.match(/[a-zA-Z一-鿿]+$/)?.[0])||'';
    const matched=nameMap.get(name);
    if(!matched) return {name, qty, unit, ok:false};
    const totalQty=matched.reduce((s,f)=>s+f.remaining,0);
    return {name, qty, unit, totalQty, ok:true, matched};
  }).filter(Boolean);
  const ok=parsed.filter(x=>x.ok);
  if(!ok.length){toast('未能匹配库存食材');return;}
  document.getElementById('cookPreview').innerHTML='<div style="margin-top:12px">'+ok.map(it=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><b>${it.name}</b><span>剩余 ${it.totalQty.toFixed(1)} · 扣除 ${it.qty}${it.unit}</span></div>`).join('')+'</div>';
  document.getElementById('cookPreview').innerHTML+='<button class="primary" style="margin-top:12px" onclick="confirmCookBatch(window._cookPending)">✓ 确认扣除（${ok.length}项）</button>';
  window._cookPending = ok;
}

function confirmCookBatch(parsed){
  const date=document.getElementById('cDate').value;
  const meal=document.getElementById('cMeal').value;
  const items=[], batches=[];
  let total=0;
  for(const it of parsed){
    const matched=it.matched.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    let need=it.qty;
    for(const f of matched){
      if(need<=1e-9) break;
      const take=Math.min(f.remaining, need);
      const up=f.unitPrice||(f._origQty>0?f.amount/f._origQty:0);
      const cost=take*up;
      f.qty-=take/f.qty*f.qty; // reduce proportionally
      f.remaining-=take;
      if(f.remaining<0.001){f.remaining=0;f.qty=0;}
      batches.push({foodId:f.id,name:f.name,qty:take,unit:f.unit,cost});
      total+=cost;
      need-=take;
    }
  }
  if(!batches.length){toast('没有可扣除的食材');return;}
  db.meals.push({id:Date.now(),date,meal,total,items:batches});
  closeModal(); save(); toast(`已扣除 ${batches.length} 项，¥${total.toFixed(2)}`);
}

function saveFoodEdit(id){
  const f = db.foods.find(x=>x.id===id);
  if(!f){ closeModal(); return; }
  const newName = document.getElementById('eName').value.trim();
  const newDate = document.getElementById('eDate').value;
  const newAmount = +document.getElementById('eAmount').value;
  const newQty = +document.getElementById('eQty').value;
  const newUnit = document.getElementById('eUnit').value;
  const newStorage = document.querySelector('#eStorage button.active')?.dataset.s || f.storage;
  const newExpires = document.getElementById('eExpires').value;
  const newThreshold = +document.getElementById('eThreshold').value;

  if(!newName){ toast('请填写食材名'); return; }
  if(newAmount<=0){ toast('请填写金额'); return; }
  if(newQty<=0){ toast('请填写数量'); return; }

  // 归一化名称
  const norm = normalizeFoodName(newName);
  const finalName = norm.canonical || newName;

  // 单价语义：单价 = 总金额 / 原始购买量
  // _origQty 表示"原始购买量"，qty 表示"当前剩余量"
  // 编辑场景下用户改 qty 和 amount：
  //   - 如果 qty 不超过 _origQty：_origQty 不变，单价 = newAmount / _origQty
  //   - 如果 qty 超过 _origQty（库存增加了）：_origQty = qty, 单价 = newAmount / qty
  // 剩余价值 = 单价 × qty
  const isIncreased = newQty > (f._origQty || 0);
  const newOrigQty = isIncreased ? newQty : (f._origQty || newQty);
  const unitPrice = newAmount / newOrigQty;
  const remaining = unitPrice * newQty;

  // 更新字段
  f.name = finalName;
  f.displayName = norm.display || newName;
  f.date = newDate;
  f.amount = newAmount;
  f._origQty = newOrigQty;
  f.qty = newQty;
  f.unit = newUnit;
  f.remaining = remaining;
  f.unitPrice = unitPrice; // 缓存单价（可选，方便统计）
  f.storage = newStorage;
  f.expiresAt = newExpires;
  // 按新存储方式重算保质期
  const shelf = SHELF_DB[normalize(finalName)] || shelfFor(finalName);
  f.shelfLifeDays = newStorage==='frozen' ? Math.max(30, shelf.days) : shelf.days;
  f.lowStockThreshold = Math.max(0, newThreshold);
  f.batchKey = finalName+'|'+newDate;

  closeModal(); save();
  toast(`已更新：${finalName}（单价 ${money(unitPrice)}/${unitText(newUnit)}）`);
}

function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('浏览器不支持语音识别'); return; }
  if(voiceRecog){
    try{ voiceRecog.stop(); }catch(e){}
    voiceRecog=null;
    document.getElementById('voiceMic').classList.remove('live');
    document.getElementById('voiceHint').textContent='点击开始录音';
    return;
  }
  voiceRecog = new SR();
  voiceRecog.lang = 'zh-CN';
  voiceRecog.interimResults = true;
  voiceRecog.continuous = false;
  voiceRecog.maxAlternatives = 3;
  voiceBuf='';
  voiceRecog.onresult = (e)=>{
    let final='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    const text = (voiceBuf+final+interim).trim();
    document.getElementById('voiceResult').innerHTML = text
      ? `<b>${text}</b>` + (interim?`<div class="alt">…识别中</div>`:'')
      : '<span class="muted">请说话…</span>';
    if(final){
      voiceBuf += final;
      const parsed = parseVoiceCommand(voiceBuf);
      renderVoiceParsed(parsed);
    }
  };
  voiceRecog.onend = ()=>{
    voiceRecog=null;
    document.getElementById('voiceMic').classList.remove('live');
    document.getElementById('voiceHint').textContent='点击重新录音';
  };
  voiceRecog.onerror = (e)=>{
    toast('语音识别失败：'+e.error);
    voiceRecog=null;
    document.getElementById('voiceMic').classList.remove('live');
    document.getElementById('voiceHint').textContent='点击开始录音';
  };
  voiceRecog.start();
  document.getElementById('voiceMic').classList.add('live');
  document.getElementById('voiceHint').textContent='正在录音…再次点击结束';
}

// 中文数字 + 单位解析
const CN_NUM = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'百':100,'千':1000,'半':0.5};
function cnNumToInt(s){
  // 简单处理：千/百/十 组合
  if(/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  // 五百克 → 500
  const digits = s.match(/[一二两三四五六七八九十百千万半0-9]/g);
  if(!digits) return null;
  // 提取"五百"形式：先抓 "X百X十X"
  let result = 0, section = 0, num = 0;
  const map = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const unit = {'十':10,'百':100,'千':1000,'万':10000};
  for(const ch of s){
    if(ch in map){ num = map[ch]; }
    else if(ch in unit){
      const u = unit[ch];
      if(num===0 && u===10) num=1; // "十"开头
      section += num * u;
      num = 0;
    } else if(ch==='半'){
      section += 0.5;
      num = 0;
    } else if(/\d/.test(ch)){
      num = parseFloat(ch);
    }
  }
  result = section + num;
  if(!result) {
    const m2 = s.match(/(\d+(\.\d+)?)/);
    if(m2) return parseFloat(m2[1]);
  }
  return result || null;
}

function parseVoiceCommand(text){
  // 目标：{name, qty, unit, amount}
  const result = {name:'', qty:1, unit:'portion', amount:0, confidence:'low'};

  // 1) 提取金额：钱/元/块/RMB
  const amtMatch = text.match(/(\d+(\.\d+)?|\S+)\s*(元|块|块钱|钱)/);
  if(amtMatch){
    const amt = cnNumToInt(amtMatch[1]);
    if(amt) result.amount = amt;
  }

  // 2) 提取数量+单位
  const qtyPatterns = [
    /(\d+(\.\d+)?|\S+)\s*(克|千克|公斤|斤|两|ml|毫升|升|个|只|条|根|袋|盒|份|包|颗|块|片|把)/i,
    /(半)\s*(个|只|袋|盒|份|块|片|把)?/
  ];
  for(const pat of qtyPatterns){
    const m = text.match(pat);
    if(m){
      if(m[1]==='半'){
        result.qty = 0.5;
        result.unit = unitAlias(m[2]||'份');
      } else {
        const q = cnNumToInt(m[1]);
        if(q) result.qty = q;
        // 注意："两"在 cnNumToInt 里 = 2，但 unitAlias("两") 返回 'g' 是错的
        // 单位正则里没"两"了，所以 m[3] 一定是真单位
        if(m[3]) result.unit = unitAlias(m[3]);
      }
      break;
    }
  }

  // 3) 提取食材名：先去掉数量+单位词和金额词，剩余部分
  // 数量词模式：数字 / 中文数字 + (量词)?  —— 注意"两"是数字(2)而非单位
  const numUnitPattern = '(\\d+(\\.\\d+)?|[一二三四五六七八九十百千半]+)\\s*(克|千克|公斤|斤|ml|毫升|升|个|只|条|根|袋|盒|份|包|颗|块|片|把)';
  const amountPattern = '(\\d+(\\.\\d+)?|[一二三四五六七八九十百千半]+)\\s*(元|块|块钱|钱)';
  let name = text
    .replace(/\s+/g,'')
    .replace(new RegExp(amountPattern,'g'),'')
    .replace(new RegExp(numUnitPattern,'gi'),'')
    .replace(/半(个|只|袋|盒|份|块|片|把)?/g,'')
    .replace(/[，。！？、,.\!?]/g,'')
    .trim();
  result.name = name;

  // 4) 修正：如果没识别到数量但有"半"，qty 默认 0.5
  if(!qtyPatterns.some(p=>p.test(text))){
    if(text.includes('半')) result.qty = 0.5;
  }

  // 5) 置信度
  const confidence = (result.name && result.qty && result.amount) ? 'high'
                   : (result.name && (result.qty || result.amount)) ? 'medium'
                   : 'low';
  result.confidence = confidence;
  return result;
}
function unitAlias(u){
  const m = (u||'').toLowerCase();
  if(/克|千克|公斤|斤|两/.test(m)) return 'g';
  if(/毫升|升|ml|l/.test(m)) return 'ml';
  if(/个|只|条|根|颗|片/.test(m)) return 'count';
  if(/袋|盒|份|包|块/.test(m)) return 'portion';
  return 'portion';
}

function renderVoiceParsed(p){
  const box=document.getElementById('voiceParsed');
  const btnBox=document.getElementById('voiceBtns');
  if(!p.name){
    box.innerHTML='<div class="muted">未能识别食材名，请重试或手动填写</div>';
    btnBox.innerHTML='';
    return;
  }
  box.innerHTML=`<div class="card" style="margin-top:12px">
    <div class="row"><div><b>${p.name}</b> <span class="muted">置信度 ${p.confidence==='high'?'高':p.confidence==='medium'?'中':'低'}</span></div></div>
    <div class="muted">数量 ${p.qty} ${unitText(p.unit)} · 金额 ${money(p.amount)}</div>
  </div>`;

  document.getElementById('ocrFile').onchange = onOCRFileChange;

async function onOCRFileChange(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = document.getElementById('ocrPreview');
    img.src = ev.target.result;

  };

async function runOCR(file){
  const status = document.getElementById('ocrStatus');
  const list = document.getElementById('ocrList');
  const btnBox = document.getElementById('ocrBtns');
  status.textContent='⏳ 加载 OCR 引擎…';
  list.innerHTML=''; btnBox.innerHTML=''; ocrItems=[]; ocrRawText='';

  if(!window.Tesseract){
    // 动态注入 CDN
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  try{
    status.textContent='⏳ 识别中…（首次需要下载中文模型，请耐心等待 10-30 秒）';
    const worker = await Tesseract.createWorker('chi_sim', 1, {
      logger: m=>{
        if(m.status==='recognizing text'){
          status.textContent=`⏳ 识别中… ${(m.progress*100).toFixed(0)}%`;
        } else if(m.status){
          status.textContent=`⏳ ${m.status}…`;
        }
      }
    });
    const { data } = await worker.recognize(file);
    await worker.terminate();
    status.textContent=`✅ 识别完成，共 ${data.text.length} 字符`;
    ocrRawText = data.text;
    ocrItems = parseOCRText(data.text);
    renderOCRItems();
  }catch(err){
    status.innerHTML=`<span style="color:var(--danger)">❌ 识别失败：${err.message||err}</span>`;
  }
}

// 小票文本 → (商品名, 单价, 数量) 列表
// 策略：
//  1) 同行匹配：商品名 ... ¥价格（最理想）
//  2) 相邻行配对：商品名行 + 下一行只有价格，配成一项（电商常见）
//  3) 跳过：合计/实付款/总计/应付/找零/支付/优惠/折扣/快递/邮费/单号/时间/店名/收银员/会员/积分/日期/谢谢/欢迎/TOTAL/Subtotal 等
function parseOCRText(text){
  const items = [];
  const rawLines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);

  const priceRe = /(\d+\.\d{1,2})\s*[元¥]?$/;
  const priceOnlyRe = /^[¥￥]?\s*(\d+\.\d{1,2})\s*[元¥]?\s*$/;
  const qtyRe = /[xX*×]\s*(\d+)|(\d+)\s*[xX*×]/;
  const skipWords = /(合计|小计|总计|应收|应付|实付|已付|实付款|总价|线上付|找零|支付|优惠|折扣|减免|邮费|运费|包邮|包退|单号|订单号|快递|物流|时间|收银员|会员|积分|日期|谢谢|欢迎|TOTAL|Subtotal|查看|评价|购物车|更多|交易|成功)/i;
  // 含中文且≥3 字、长度≤40 → 可能是商品名
  // 去空格后再判断（OCR 经常字间加空格导致含 skip 词的字串被拆开，如"实 付 款 Y"）
  const collapse = s => (s||'').replace(/\s+/g,'');
  const looksLikeName = s => /[\u4e00-\u9fa5]/.test(s) && s.length>=3 && s.length<=40 && !skipWords.test(collapse(s));
  // 价格行：单纯 ¥x.xx 或 x.xx
  const looksLikePrice = s => priceOnlyRe.test(s);

  for(let i=0;i<rawLines.length;i++){
    const line = rawLines[i];
    if(skipWords.test(collapse(line))) continue;
    if(line.length<2 || line.length>50) continue;

    // 模式 1：同行匹配
    const pm = line.match(priceRe);
    if(pm){
      const price = parseFloat(pm[1]);
      if(price<=0 || price>9999) continue;
      const namePart = line.substring(0, pm.index).trim();
      let name = namePart.replace(qtyRe,'').replace(/[xX*×]/g,'').replace(/^[\d\s\-\/]+/,'').trim();
      if(!looksLikeName(name)) continue;
      let qty = 1;
      const qm = namePart.match(qtyRe);
      if(qm){ qty = parseFloat(qm[1]||qm[2]) || 1; }
      items.push({name, price, qty, unit:'portion', keep:true});
      continue;
    }

    // 模式 2：商品名行 + 后续 1-N 行（规格/数量/价格）
    if(looksLikeName(line)){
      // 提取商品名中的 xN/数量标记
      let qty = 1;
      const qm = line.match(qtyRe);
      if(qm){ qty = parseFloat(qm[1]||qm[2]) || 1; }
      // 商品名清理
      let name = line.replace(/[xX*×]\s*\d+\s*$/,'').replace(/^[\d\s\-\/]+/,'').trim();
      // 临时 unit（从后续规格行推断）
      let unit = null;
      let price = null;
      // 先缓存后面 5 行，分类（规格 / 价格 / 数量 / 描述）
      const candidates = [];
      for(let j=i+1;j<=Math.min(i+5, rawLines.length-1);j++){
        const next = rawLines[j];
        if(skipWords.test(collapse(next))) break;
        // 价格行
        if(!price){
          const np = next.match(priceOnlyRe);
          if(np){ price = parseFloat(np[1]); continue; }
        }
        // 规格行（数字+单位）
        if(!unit){
          const specMatch = next.match(/(\d+\.?\d*)\s*(g|kg|ml|l|斤|两)\b/i);
          if(specMatch){
            const specQty = parseFloat(specMatch[1]);
            const specU = specMatch[2].toLowerCase();
            if(specU==='kg' || specU==='千克'){ unit='g'; qty = specQty*1000; }
            else if(specU==='l' || specU==='升'){ unit='ml'; qty = specQty*1000; }
            else if(specU==='两'){ unit='g'; qty = specQty*50; }
            else if(specU==='斤'){ unit='g'; qty = specQty*500; }
            else { unit = specU==='千克'?'g':(specU==='毫升'?'ml':specU); qty = specQty; }
            continue;
          }
        }
        // 数量行 xN / ×N / Nx
        if(qty===1){
          const xMatch = next.match(/^[xX*×]\s*(\d+)$/) || next.match(/^(\d+)\s*[xX*×]$/);
          if(xMatch){ qty = parseFloat(xMatch[1]) || 1; continue; }
        }
        // 含中文描述行（"纯可可味"、"原味"、"袋装/1件"等）—跳过
        if(/[\u4e00-\u9fa5]/.test(next)) continue;
        // 其他行：跳过
      }
      if(price===null || price<=0 || price>9999) continue;
      if(!unit){
        const norm = normalizeFoodName(name);
        unit = defaultUnit(norm.canonical || name);
      }
      items.push({name, price, qty, unit, keep:true});
    }
  }

  // 去重（同名累加）
  const merged = new Map();
  for(const it of items){
    if(merged.has(it.name)){
      const m=merged.get(it.name);
      m.qty += it.qty;
      m.price = Math.max(m.price, it.price);
    } else merged.set(it.name, {...it});
  }
  return [...merged.values()];
}

  }).join('')}</div>
    <div class="muted" style="margin-top:8px">💡 名称已自动归一（如"COLACAO 可可粉"→可可粉）；想看原名看下方小字；识别错的直接修改</div>

  list.querySelectorAll('button[data-k=del]').forEach(b=>{

}

function confirmOCRAdd(){
  const items = ocrItems.filter(x=>x.keep && x.name);
  if(!items.length){ toast('没有可添加的项'); return; }
  const date = today();
  let added = 0;
  for(const it of items){
    // 归一化食材名（去除品牌、规格、促销词，归到本质类）
    const norm = normalizeFoodName(it.name);
    const finalName = norm.canonical || it.name;
    const displayName = norm.display || it.name;
    const qty = it.qty||1;
    // OCR 解析出的 price 始终是总价（金额）；amount 直接用 price
    const amt = it.price || 0;
    // 同日同名 → 合并（同 addFood 逻辑）
    const existing = db.foods.find(f=>f.name===finalName && f.date===date);
    if(existing){
      const oldUnitPrice = existing.amount / existing._origQty;
      existing._origQty += qty;
      existing.qty += qty;
      existing.amount += amt;
      existing.remaining = oldUnitPrice * existing.qty;
      existing.unitPrice = existing.amount / existing._origQty;
      added++;
      continue;
    }
    const shelf = SHELF_DB[normalize(finalName)] || shelfFor(finalName);
    const exp = new Date(date+'T00:00:00'); exp.setDate(exp.getDate()+shelf.days);
    db.foods.push({
      id:Date.now()+added, date, name:finalName, displayName, amount:amt, remaining:amt, qty, _origQty:qty,
      unitPrice: qty>0 ? amt/qty : 0,
      unit:it.unit||'portion', batchKey:finalName+'|'+date, storage:shelf.storage||'fridge',
      shelfLifeDays:shelf.days, expiresAt:exp.toISOString().slice(0,10),
      lowStockThreshold:Math.max(1, Math.round(qty*0.2))
    });
    added++;
  }
  closeModal(); save(); toast(`已加入 ${added} 项`);
}

/* ============================================================
   过期/补货提醒
   ============================================================ */
function computeReminders(foods){
  foods = foods || db.foods;
  const todayStr = today();
  const reminders = {expired:[], expiring:[], lowStock:[]};

  foods.forEach(f=>{
    if(f.remaining <= 0.001) return;
    const daysLeft = daysBetween(todayStr, f.expiresAt);
    if(daysLeft < 0){
      reminders.expired.push({food:f, days:-daysLeft});
    } else if(daysLeft <= 3){
      reminders.expiring.push({food:f, days:daysLeft});
    }
    if(f.qty <= (f.lowStockThreshold||0)){
      reminders.lowStock.push({food:f, qty:f.qty});
    }
  });

  // 去重（同一食材取最早过期或最低余量）
  const uniq = (arr, key)=>{
    const map = new Map();
    for(const item of arr){
      const k = key(item);
      if(!map.has(k) || item.food.expiresAt < map.get(k).food.expiresAt){
        map.set(k, item);
      }
    }
    return [...map.values()];
  };
  reminders.expiring = uniq(reminders.expiring, x=>x.food.name).sort((a,b)=>a.days-b.days);
  reminders.expired = uniq(reminders.expired, x=>x.food.name).sort((a,b)=>b.days-a.days);
  reminders.lowStock = uniq(reminders.lowStock, x=>x.food.name);

  return reminders;
}

}

/* ============================================================
   周统计
   ============================================================ */
let weekOffset = 0;
function getWeekRange(offset=0){
  const now = new Date();
  const day = now.getDay();
  const mondayOffset = day===0 ? -6 : 1-day;
  const mon = new Date(now);
  mon.setDate(now.getDate() + mondayOffset + offset*7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt = d => d.toISOString().slice(0,10);
  const label = `${mon.getMonth()+1}/${mon.getDate()} – ${sun.getMonth()+1}/${sun.getDate()}`;
  return {start:fmt(mon), end:fmt(sun), label};
}
function shiftWeek(d){ weekOffset += d; render(); }
function renderWeek(){
  const {start,end,label} = getWeekRange(weekOffset);
  document.getElementById('weekRange').textContent = weekOffset===0 ? `本周（${label}）` : label;
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(start+'T00:00:00'); d.setDate(d.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  const card = document.getElementById('weekCard');
  const dayRows = days.map(d=>{
    const outs = db.outside.filter(x=>x.date===d);
    const meals = db.meals.filter(x=>x.date===d);
    const tot = outs.reduce((s,x)=>s+x.amount,0) + meals.reduce((s,x)=>s+x.total,0);
    const dayLabel = new Date(d+'T00:00:00').toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'});
    const detailId = 'detail-'+d;
    const itemsHtml = [
      ...outs.map(o=>`<div class="item"><span>🍜 ${o.meal}${o.note?' · '+o.note:''}</span><span>${money(o.amount)}</span></div>`).join(''),
      ...meals.map(m=>`<div class="item"><span>🥬 ${m.meal} · ${m.items.map(i=>i.name).join('、')}</span><span>${money(m.total)}</span></div>`).join('')
    ].join('') || '<div class="muted" style="padding:6px 0">无记录</div>';
    return `<div class="day-row" onclick="toggleDay('${detailId}',this)">
      <div class="row"><div><b>${dayLabel}</b></div><b>${money(tot)}</b></div>
      <div class="day-detail" id="${detailId}">${itemsHtml}</div>
    </div>`;
  }).join('');
  const weekTotal = days.reduce((s,d)=>{
    return s + db.outside.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0)
              + db.meals.filter(x=>x.date===d).reduce((a,x)=>a+x.total,0);
  }, 0);
  card.innerHTML = `<div class="row" style="margin-bottom:8px"><span class="muted">本周合计</span><b style="font-size:18px">${money(weekTotal)}</b></div>${dayRows}`;
}
function toggleDay(id, row){

}

/* ============================================================
   主渲染
   ============================================================ */

// 食材分类映射（按归一后的 canonical 名称归到 5 大类）
const CATEGORY_MAP = {
  '蔬菜':['白菜','菠菜','生菜','番茄','土豆','洋葱','胡萝卜','黄瓜','茄子','青椒','辣椒','花菜','蘑菇','香菇','豆制品','豆腐'],
  '肉禽蛋':['鸡蛋','鸡胸肉','鸡腿','鸡翅','鸡爪','鸡肉','排骨','五花肉','里脊肉','梅花肉','猪蹄','猪肝','猪肉','牛排','牛腩','牛腱','牛尾','牛筋','牛肋条','五花趾','肥牛','牛肉','羊肉'],
  '水产海鲜':['鱼','虾','螃蟹','贝类','海鲜'],
  '水果':['苹果','香蕉','橙子','葡萄','草莓','蓝莓','西瓜','桃子','梨','芒果','柠檬'],
  '乳品':['牛奶','酸奶','奶粉','奶酪','黄油','奶油'],
  '米面粮油':['大米','面条','面包','面食','食用油','酱油','醋','糖','盐'],
  '调料':['味精','料酒','蚝油','调味酱'],
  '冲饮零食':['可可粉','巧克力','咖啡','茶饮','燕麦冲饮','面粉','烘焙原料','零食','坚果','糖果','果干','汽水','矿泉水','啤酒','果汁'],
};
function getCategory(canonical){
  for(const cat in CATEGORY_MAP){
    if(CATEGORY_MAP[cat].includes(canonical)) return cat;
  }
  return '其他';
}
// 调色板：8 类，每类一个色
const CAT_COLORS = {
  '蔬菜':'#7cb86c','肉禽蛋':'#d97757','水产海鲜':'#5b9bd5','水果':'#e8a87c',
  '乳品':'#f0e68c','米面粮油':'#c19a6b','调料':'#9b8fe0','冲饮零食':'#e57b9e','其他':'#aaa'
};

// 库存视图状态
let inventoryView = 'expire'; // 'expire' | 'category'

function renderInventoryStats(){
  const box = document.getElementById('inventoryStats');
  if(!box) return;
  const items = db.foods.filter(f=>f.remaining>0.001);
  if(!items.length){ box.innerHTML=''; return; }

  // 1) 按分类聚合：剩余价值、数量、项数
  const catAgg = {}; // cat -> { value, count, qty }
  items.forEach(f=>{
    const cat = getCategory(f.name);
    if(!catAgg[cat]) catAgg[cat] = {value:0, count:0, qty:0};
    catAgg[cat].value += f.remaining||0;
    catAgg[cat].count += 1;
    catAgg[cat].qty += f.qty||0;
  });
  const totalValue = Object.values(catAgg).reduce((s,x)=>s+x.value, 0);
  const totalCount = items.length;

  // 2) 按过期时间分桶（基于剩余价值）
  const todayStr = today();
  const buckets = [
    {label:'已过期', max:-1, value:0, items:[], color:'#b85c52'},
    {label:'今天', max:0, value:0, items:[], color:'#d97757'},
    {label:'1-2天', max:2, value:0, items:[], color:'#e8a87c'},
    {label:'3-7天', max:7, value:0, items:[], color:'#f0c674'},
    {label:'>7天', max:9999, value:0, items:[], color:'#7cb86c'},
  ];
  items.forEach(f=>{
    const d = daysBetween(todayStr, f.expiresAt);
    if(d<0){ buckets[0].value += f.remaining; buckets[0].items.push(f); }
    else if(d===0){ buckets[1].value += f.remaining; buckets[1].items.push(f); }
    else if(d<=2){ buckets[2].value += f.remaining; buckets[2].items.push(f); }
    else if(d<=7){ buckets[3].value += f.remaining; buckets[3].items.push(f); }
    else { buckets[4].value += f.remaining; buckets[4].items.push(f); }
  });
  const totalExpiryValue = buckets.reduce((s,b)=>s+b.value, 0);

  // 3) 补货优先级：即将过期（≤3天）且库存低于阈值
  const priority = items.filter(f=>{
    const d = daysBetween(todayStr, f.expiresAt);
    return d >= 0 && d <= 3 && f.qty <= (f.lowStockThreshold||0) * 2;
  }).sort((a,b)=>daysBetween(todayStr, a.expiresAt) - daysBetween(todayStr, b.expiresAt)).slice(0,5);

  // 渲染
  // 饼图（按分类价值）
  const cats = Object.entries(catAgg).sort((a,b)=>b[1].value - a[1].value);
  const pieSegments = renderPieSegments(cats, totalValue);

  let html = '';

  // 卡片 1：库存总览 + 分类饼图
  html += `<div class="viz-card">
    <div class="viz-title">📊 库存分布（按分类）</div>
    <div class="viz-total">共 ${totalCount} 项，总价值 ${money(totalValue)}</div>
    <svg class="viz-pie" viewBox="-50 -50 100 100">${pieSegments}</svg>
    <div class="viz-legend">${cats.map(([cat,v])=>{
      const pct = totalValue>0 ? (v.value/totalValue*100).toFixed(0) : 0;
      return `<div class="viz-legend-item"><div class="viz-swatch" style="background:${CAT_COLORS[cat]||'#aaa'}"></div>${cat} ${money(v.value)} (${pct}%) · ${v.count}项</div>`;
    }).join('')}</div>
  </div>`;

  // 卡片 2：过期时间轴
  if(totalExpiryValue > 0){
    html += `<div class="viz-card">
      <div class="viz-title">⏳ 过期分布（按剩余价值）</div>
      <div class="viz-timeline">
        <div class="viz-timeline-bar">${buckets.map(b=>{
          if(totalExpiryValue<=0 || b.value<=0) return '';
          const pct = (b.value/totalExpiryValue*100);
          return `<div class="viz-timeline-seg" style="flex:${pct};background:${b.color}" title="${b.label}: ${money(b.value)} (${b.items.length}项)">${pct>=8?b.items.length:''}</div>`;
        }).join('')}</div>
        <div class="viz-timeline-labels">
          ${buckets.map(b=>b.value>0?`<span>${b.label}</span>`:`<span style="opacity:.3">${b.label}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }

  // 卡片 3：补货优先级
  if(priority.length){
    html += `<div class="viz-card">
      <div class="viz-title">⚡ 优先消耗（即将过期 + 库存低）</div>
      ${priority.map(f=>{
        const d = daysBetween(todayStr, f.expiresAt);
        const dayTxt = d===0?'今天到期':`${d}天后到期`;
        return `<div class="viz-priority-row">
          <div class="viz-priority-name">${f.name}</div>
          <div class="viz-priority-meta">${dayTxt} · 剩 ${f.qty||0}${unitText(f.unit)}</div>
          <button class="ghost" onclick="openCook()">做饭</button>
        </div>`;
      }).join('')}
    </div>`;
  }

  box.innerHTML = html;
}

// 饼图分段（SVG path），返回多段 path 字符串
function renderPieSegments(cats, totalValue){
  if(totalValue<=0 || cats.length===0) return '';
  const r = 42, cx = 0, cy = 0;
  let acc = 0;
  return cats.map(([cat, v], idx)=>{
    const pct = v.value / totalValue;
    if(pct<=0.001) return '';
    const startAngle = acc * 2 * Math.PI - Math.PI/2;
    acc += pct;
    const endAngle = acc * 2 * Math.PI - Math.PI/2;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const largeArc = pct > 0.5 ? 1 : 0;
    const path = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    const color = CAT_COLORS[cat] || '#aaa';
    return `<path d="${path}" fill="${color}" stroke="#fff" stroke-width="1"><title>${cat}: ${money(v.value)}</title></path>`;
  }).join('');
}

function switchInventoryView(view){
  inventoryView = view;
  document.querySelectorAll('#viewTabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  render();
}

function renderFoodCard(f, allNames, todayStr, opts={}){
  const similar = allNames.filter(n=>n!==f.name && similarity(n,f.name)>=0.6);
  const expDays = daysBetween(todayStr, f.expiresAt);
  let extra='';
  let rowCls = similar.length ? 'similar-row' : '';
  if(expDays<0){ extra=`<div class="muted" style="color:var(--urgent)">⚠ 已过期 ${-expDays} 天</div>`; rowCls='expired'; }
  else if(expDays<=3){
    const dayTxt = expDays===0 ? '今天到期' : `${expDays}天后到期`;
    extra=`<div class="muted" style="color:var(--warn)">⏳ ${dayTxt}</div>`;
    rowCls = rowCls ? rowCls : 'expire-soon';
  }
  return `<div class="card ${rowCls.trim()}"><div class="row"><div>
    <b>${f.name}</b><span class="shelf-pill ${f.storage||'fridge'}">${({fridge:'🧊冷藏',frozen:'❄冷冻',room:'🌡常温'})[f.storage||'fridge']}</span>
    ${f.displayName && f.displayName!==f.name ? `<div class="muted">原: ${f.displayName}</div>` : ''}
    ${similar.length?`<div class="muted" style="color:var(--warn)">⚠ 与「${similar[0]}」相似，可能需合并</div>`:''}
    <div class="muted">购于 ${f.date} · 原价 ${money(f.amount)}</div>
    <div class="muted">${f.qty||0}${unitText(f.unit)} · 保质期 ${f.shelfLifeDays||7}天${f.unitPrice?` · 单价 ${money(f.unitPrice)}/${unitText(f.unit)}`:''}</div>
    ${extra}
    </div><div style="text-align:right"><b>${money(f.remaining)}</b><div class="muted">剩余</div>
    <div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end">
      <button class="ghost" onclick="editFood(${f.id})">编辑</button>
      <button class="danger" onclick="delFood(${f.id})">删除</button>
    </div></div></div></div>`;
}

function renderInventoryList(inv, allNames, todayStr){
  const box = document.getElementById('inventoryList');
  if(!inv.length){ box.innerHTML='<div class="empty">库存为空</div>'; return; }
  if(inventoryView==='category'){
    // 按分类分组
    const groups = {};
    inv.forEach(f=>{
      const cat = getCategory(f.name);
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push(f);
    });
    const sortedCats = Object.keys(groups).sort((a,b)=>groups[b].reduce((s,f)=>s+f.remaining,0) - groups[a].reduce((s,f)=>s+f.remaining,0));
    box.innerHTML = sortedCats.map(cat=>{
      const items = groups[cat].sort((a,b)=>daysBetween(todayStr,a.expiresAt) - daysBetween(todayStr,b.expiresAt));
      const catValue = items.reduce((s,f)=>s+f.remaining,0);
      return `<div class="viz-cat-group">
        <div class="viz-cat-group-title" style="color:${CAT_COLORS[cat]}">${cat}（${items.length}项 · ${money(catValue)}）</div>
        ${items.map(f=>renderFoodCard(f, allNames, todayStr)).join('')}
      </div>`;
    }).join('');
  } else {
    // 按过期时间排序（默认）
    const sorted = inv.slice().sort((a,b)=>daysBetween(todayStr,a.expiresAt) - daysBetween(todayStr,b.expiresAt));
    box.innerHTML = sorted.map(f=>renderFoodCard(f, allNames, todayStr)).join('');
  }
}

function render(){
  // 提醒条
  renderAlertBar();

  const d=today();
  const outs=db.outside.filter(x=>x.date===d);
  const meals=db.meals.filter(x=>x.date===d);
  const oc=outs.reduce((s,x)=>s+x.amount,0);
  const mc=meals.reduce((s,x)=>s+x.total,0);
  document.getElementById('todayTotal').textContent=money(oc+mc);
  document.getElementById('todayOutside').textContent=oc.toFixed(2);
  document.getElementById('todayCook').textContent=mc.toFixed(2);

  const list=[
    ...outs.map(x=>({kind:'outside', id:x.id, t:x.meal, n:x.note||'外食', a:x.amount})),
    ...meals.map(x=>({kind:'meal', id:x.id, t:x.meal, n:x.items.map(i=>i.name).join('、'), a:x.total}))
  ];
  document.getElementById('todayList').innerHTML = list.length
    ? list.map(x=>`<div class="card"><div class="row"><div><b>${x.t}</b><div class="muted">${x.n}</div></div>
        <div class="edit-row"><b>${money(x.a)}</b>
          <button class="ghost" onclick="${x.kind==='outside'?`openOutside(${x.id})`:`openMealEdit(${x.id})`}">编辑</button>
          <button class="danger" onclick="${x.kind==='outside'?`delOutside(${x.id})`:`delMeal(${x.id})`}">×</button>
        </div></div></div>`).join('')
    : '<div class="empty">今天还没有伙食费记录</div>';

  // 库存按"最早过期"升序：先过期排顶，帮助优先消耗临期食材
  const inv=db.foods.filter(f=>f.remaining>0.001).slice().sort((a,b)=>a.expiresAt.localeCompare(b.expiresAt));
  const allNames=[...new Set(db.foods.map(f=>f.name))];
  const todayStr = today();

  document.getElementById('recentFood').innerHTML = inv.slice(0,4).map(f=>{
    const similar = allNames.filter(n=>n!==f.name && similarity(n,f.name)>=0.6);
    const expDays = daysBetween(todayStr, f.expiresAt);
    let expireNote = '';
    let rowCls = '';
    if(expDays < 0){ expireNote = `<span class="muted" style="color:var(--urgent)">⚠ 已过期 ${-expDays} 天</span>`; rowCls='expired'; }
    else if(expDays <= 3){
      const dayTxt = expDays===0 ? '今天到期' : `${expDays}天后到期`;
      expireNote = `<span class="muted" style="color:var(--warn)">⏳ ${dayTxt}</span>`;
      rowCls='expire-soon';
    }
    return `<div class="card ${rowCls}"><div class="row"><div>
      <b>${f.name}</b><span class="shelf-pill ${f.storage||'fridge'}">${({fridge:'🧊冷藏',frozen:'❄冷冻',room:'🌡常温'})[f.storage||'fridge']}</span>
      ${similar.length?`<div class="muted" style="color:var(--warn)">⚠ 与「${similar[0]}」相似</div>`:''}
      <div class="muted">${f.qty||0}${unitText(f.unit)} · ${f.date}</div>
      ${expireNote?`<div>${expireNote}</div>`:''}
      </div><div><b>${money(f.remaining)}</b><div class="muted">剩余价值</div></div></div></div>`;
  }).join('') || '<div class="empty">还没有采购记录</div>';

  renderInventoryList(inv, allNames, todayStr);
  renderInventoryStats();

  const all=[
    ...db.outside.map(x=>({date:x.date, type:'外食', meal:x.meal, note:x.note||'外食', amount:x.amount, kind:'outside', id:x.id})),
    ...db.meals.map(x=>({date:x.date, type:'做饭', meal:x.meal, note:x.items.map(i=>i.name).join('、'), amount:x.total, kind:'meal', id:x.id}))
  ].sort((a,b)=>b.date.localeCompare(a.date) || b.id-a.id);
  document.getElementById('recordsList').innerHTML = all.length
    ? all.map(x=>`<div class="card"><div class="row"><div>
        <span class="tag">${x.type}</span> <b>${x.meal}</b>
        <div class="muted">${x.date} · ${x.note}</div>
        </div>
        <div class="edit-row"><b>${money(x.amount)}</b>
          <button class="ghost" onclick="${x.kind==='outside'?`openOutside(${x.id})`:`openMealEdit(${x.id})`}">编辑</button>
        </div></div></div>`).join('')
    : '<div class="empty">暂无记录</div>';

  const ym=d.slice(0,7);
  const mo=db.outside.filter(x=>x.date.startsWith(ym)).reduce((s,x)=>s+x.amount,0);
  const mm=db.meals.filter(x=>x.date.startsWith(ym)).reduce((s,x)=>s+x.total,0);
  const mt=mo+mm;
  document.getElementById('monthTotal').textContent=money(mt);
  document.getElementById('monthOutside').textContent=money(mo);
  document.getElementById('monthCook').textContent=money(mm);
  document.getElementById('outsideBar').style.width = mt ? (mo/mt*100)+'%' : '0%';
  document.getElementById('cookBar').style.width     = mt ? (mm/mt*100)+'%' : '0%';
  const days=new Set([...db.outside,...db.meals].filter(x=>x.date.startsWith(ym)).map(x=>x.date)).size;
  document.getElementById('monthAvg').textContent = days ? `有记录的 ${days} 天，平均 ${money(mt/days)}/天` : '本月还没有记录';

  renderWeek();
}
